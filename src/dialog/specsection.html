<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Specification Section</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        :root {
            --forest: #12413c;
            --forest-soft: #eef4f3;
            --border-soft: #d7dee5;
            --text-body: #334155;
            --muted: #64748b;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #ffffff;
            color: var(--text-body);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.45;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        header.bar {
            background: var(--forest);
            color: #fff;
            padding: 12px 18px;
            flex-shrink: 0;
        }

        header.bar .crumb {
            font-size: 12px;
            opacity: 0.85;
        }

        header.bar h1 {
            margin: 2px 0 0;
            font-size: 16px;
            font-weight: 600;
        }

        main {
            flex: 1;
            overflow: auto;
            padding: 16px 18px;
        }

        .section-body {
            max-width: 780px;
        }

        /* Article heading (e.g. "2.2 BALL VALVES") */
        .lvl0 {
            font-size: 16px;
            font-weight: 700;
            color: var(--forest);
            margin: 2px 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--forest-soft);
            text-transform: capitalize;
        }

        /* PR1 size subheading (e.g. "A. NPS 3 and Smaller:") */
        .lvl1 {
            font-weight: 600;
            margin: 14px 0 4px;
        }

        .lvl2 {
            margin: 3px 0 3px 22px;
        }

        .lvl3 {
            margin: 2px 0 2px 44px;
            color: #475569;
        }

        .lvl4 {
            margin: 2px 0 2px 66px;
            color: var(--muted);
        }

        /* Outline marker: A. / 1. / a. */
        .mk {
            color: var(--forest);
            font-weight: 700;
            margin-right: 2px;
        }

        .lvl2 .mk, .lvl3 .mk {
            color: var(--muted);
            font-weight: 600;
        }

        .empty {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="bar">
            <div class="crumb" id="crumb"></div>
            <h1 id="title">Specification Section</h1>
        </header>
        <main>
            <div id="body" class="section-body"><span class="empty">Loading…</span></div>
        </main>
    </div>
</body>

</html>
